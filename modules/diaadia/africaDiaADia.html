<!DOCTYPE html>
<html lang="es">
<head>
<script src="https://browser.sentry-cdn.com/10.71.0/bundle.min.js" integrity="sha384-Z0GeEnLeg0yvo3LU6sdGDESgTZCwpVvZBIgcnddmSR+ovRPe8Esn+19CrZdcxC4Z" crossorigin="anonymous"></script>
<script src="../../assets/sentry-init.js"></script>
<script>(function(){try{var t=new URLSearchParams(location.search).get('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/supabase-config.js"></script>
<script src="../../assets/offline-storage.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Día a Día · Africa Parque de Diversiones</title>
<link rel="icon" type="image/svg+xml" href="../../assets/icons/icon.svg">
<link rel="stylesheet" href="../../assets/design-tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Paleta, tipografía y radios base ahora vienen de design-tokens.css
   (linkeado arriba). Aquí solo quedan los tokens propios de este
   módulo o los que se apartan intencionalmente del token compartido. */
:root {
  --af-blue: #3B82C4;
}
:root:not([data-theme="dark"]) {
  --card-bg-hover: #F8F1E1; /* diverge del token compartido (#F9F9F9), solo en modo claro */
}
/* [data-theme="dark"]: idéntico al de design-tokens.css, ya no se
   redeclara aquí. */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
.hidden{display:none !important;}
body{
  font-family: var(--font-body);
  background: var(--bg-body);
  background-image: var(--bg-pattern);
  background-size: 30px 30px;
  color: var(--text-main);
  min-height:100vh;
  transition: background .2s ease, color .2s ease;
}
button{font-family:inherit;}

/* ---------- HEADER ---------- */
.topbar{
  background: var(--af-coffee);
  background-image: radial-gradient(rgba(0,0,0,.15) 2px, transparent 2px);
  background-size: 26px 26px;
  color: var(--af-cream);
  border-bottom: 3px solid #26170E;
  padding: 18px 24px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:12px; flex:1; min-width:220px;}
.brand img{width:42px;height:42px;border-radius:13px;background:#fff;padding:3px;border:3px solid var(--af-cream);}
.brand-text h1{font-family: var(--font-heading); font-size:16px; line-height:1.25; margin:0; font-weight:600; text-transform:uppercase;}
.brand-text span{display:block; font-size:11px; font-weight:700; color:var(--af-amber); text-transform:uppercase; letter-spacing:.08em; margin-top:2px;}
.theme-toggle{
  flex-shrink:0; width:38px;height:38px; border-radius:12px;
  border:2px solid rgba(245,224,200,.35); background:rgba(255,255,255,.08);
  color:var(--af-cream); font-size:17px; cursor:pointer;
  display:flex;align-items:center;justify-content:center; transition:.15s;
}
.theme-toggle:hover{background:rgba(255,255,255,.18); transform:translateY(-1px);}
.btn-new-task{
  font-family: var(--font-heading); cursor:pointer; border:none; border-radius:24px;
  font-weight:600; font-size:13px; padding:11px 18px; text-transform:uppercase; letter-spacing:.02em;
  background: var(--primary); color: var(--primary-text); box-shadow: 0 5px 0 var(--primary-shadow);
  transition: transform .12s ease, box-shadow .12s ease; white-space:nowrap;
}
.btn-new-task:hover{transform:translateY(-2px);}
.btn-new-task:active{transform:translateY(5px); box-shadow:none;}

/* ---------- MAIN ---------- */
.main-wrap{ max-width:900px; margin:0 auto; padding:24px 20px 70px; }

.summary-strip{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:20px; }
.summary-pill{
  background:var(--card-bg); border:2px solid var(--card-border); border-radius:16px;
  padding:12px 14px; text-align:center;
}
.summary-pill b{display:block; font-family:var(--font-heading); font-size:22px; color:var(--primary);}
.summary-pill.vencidas b{color:var(--danger);}
.summary-pill.completadas b{color:var(--success);}
.summary-pill span{font-size:11px; color:var(--text-muted); text-transform:uppercase; font-weight:700; letter-spacing:.03em;}

.tabs{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.tab-btn{
  background:var(--card-bg); color:var(--text-card); border:2px solid var(--card-border);
  border-radius:20px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer;
  font-family:var(--font-heading); text-transform:uppercase; letter-spacing:.02em; transition:.15s;
}
.tab-btn.active{background:var(--primary); color:var(--primary-text); border-color:var(--primary-shadow);}
.tab-btn .count{ background:rgba(0,0,0,.15); border-radius:10px; padding:1px 7px; margin-left:6px; font-size:11px; }
.tab-btn.active .count{background:rgba(255,255,255,.25);}

.task-list{display:flex; flex-direction:column; gap:10px;}
.task-card{
  background:var(--card-bg); border:2px solid var(--card-border); border-radius:18px;
  padding:14px 16px; display:flex; align-items:flex-start; gap:12px;
  box-shadow: 0 3px 0 var(--card-shadow);
}
.task-card.vencida{border-color:var(--danger);}
.task-card.completada{opacity:.68;}
.task-check{
  flex-shrink:0; width:30px; height:30px; border-radius:50%; border:3px solid var(--card-border);
  background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center;
  color:transparent; font-size:15px; transition:.15s; margin-top:2px;
}
.task-check:hover{border-color:var(--success);}
.task-card.completada .task-check{ background:var(--success); border-color:var(--success); color:#fff; }
.task-body{flex:1; min-width:0;}
.task-top-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:3px;}
.task-name{font-family:var(--font-heading); font-weight:600; font-size:15px; color:var(--text-card);}
.task-card.completada .task-name{text-decoration:line-through;}
.badge{
  font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.03em;
  padding:2px 9px; border-radius:12px; color:#fff; white-space:nowrap;
}
.badge.prioridad-alta{background:var(--af-red);}
.badge.prioridad-media{background:var(--af-amber); color:var(--af-coffee);}
.badge.prioridad-baja{background:var(--af-green);}
.badge.estado-vencida{background:var(--af-red);}
.badge.estado-pendiente{background:var(--af-blue);}
.badge.estado-reprogramada{background:var(--af-amber); color:var(--af-coffee);}
.badge.categoria{background:var(--card-bg-hover); color:var(--text-muted); border:1px solid var(--card-border);}
.task-meta{font-size:12px; color:var(--text-muted); line-height:1.5;}
.task-meta b{color:var(--text-card);}
.task-desc{font-size:12.5px; color:var(--text-muted); margin-top:4px; line-height:1.5;}
.task-actions{display:flex; gap:6px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end;}
.icon-btn{
  width:32px; height:32px; border-radius:10px; border:2px solid var(--card-border);
  background:var(--card-bg-hover); color:var(--text-card); cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center; transition:.15s;
}
.icon-btn:hover{transform:translateY(-1px); border-color:var(--primary);}
.icon-btn.danger:hover{border-color:var(--danger); color:var(--danger);}

.empty-msg{
  text-align:center; padding:50px 24px; color:var(--text-muted);
  background:var(--card-bg); border:3px dashed var(--card-border); border-radius:20px;
}
.empty-msg .emoji{font-size:38px; display:block; margin-bottom:10px;}
.empty-msg h3{font-family:var(--font-heading); color:var(--text-card); margin:0 0 6px; font-size:16px; text-transform:uppercase;}
.empty-msg p{margin:0; font-size:13px;}

/* ---------- Navegador de periodo (semana/mes) ---------- */
.period-nav{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:16px; }
.period-nav #periodLabel{ font-family:var(--font-heading); font-weight:600; font-size:14px; text-transform:capitalize; min-width:170px; text-align:center; }
.btn-period-today{
  font-family:var(--font-heading); cursor:pointer; border:2px solid var(--card-border); background:var(--card-bg);
  color:var(--text-card); border-radius:16px; padding:6px 14px; font-size:11px; font-weight:700; text-transform:uppercase;
}
.btn-period-today:hover{border-color:var(--primary); color:var(--primary);}

/* ---------- Vista semanal ---------- */
.week-day{ margin-bottom:14px; }
.week-day-head{ display:flex; align-items:baseline; gap:8px; margin-bottom:6px; padding-left:2px; }
.week-day-head b{ font-family:var(--font-heading); font-size:13px; text-transform:uppercase; color:var(--text-card); }
.week-day-head span{ font-size:11px; color:var(--text-muted); }
.week-day-head.is-today b{ color:var(--primary); }
.week-chip-list{ display:flex; flex-direction:column; gap:6px; }
.week-chip{
  display:flex; align-items:center; gap:8px; background:var(--card-bg); border:2px solid var(--card-border);
  border-radius:12px; padding:8px 12px; font-size:12.5px;
}
.week-chip.completada{opacity:.6; text-decoration:line-through;}
.week-chip.vencida{border-color:var(--danger);}
.week-chip .wc-name{flex:1; font-weight:700; color:var(--text-card);}
.week-day-empty{ font-size:12px; color:var(--text-muted); opacity:.7; padding:4px 2px; }

/* ---------- Vista mensual (calendario) ---------- */
.month-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.month-dow{ text-align:center; font-size:10.5px; font-weight:800; color:var(--text-muted); text-transform:uppercase; padding-bottom:4px; }
.month-cell{
  background:var(--card-bg); border:2px solid var(--card-border); border-radius:12px;
  padding:6px 5px; min-height:56px; cursor:pointer; transition:.12s; display:flex; flex-direction:column; gap:3px;
}
.month-cell:hover{border-color:var(--primary);}
.month-cell.other-month{opacity:.35;}
.month-cell.is-today{border-color:var(--primary); border-width:3px;}
.month-cell.selected{background:var(--card-bg-hover); border-color:var(--primary);}
.month-cell .mc-num{font-family:var(--font-heading); font-weight:700; font-size:12.5px; color:var(--text-card);}
.month-cell .mc-dots{display:flex; gap:3px; flex-wrap:wrap;}
.mc-dot{width:7px; height:7px; border-radius:50%;}
.mc-dot.pendiente{background:var(--af-blue);}
.mc-dot.vencida{background:var(--danger);}
.mc-dot.completada{background:var(--success);}
.month-day-detail{ margin-top:18px; }
.month-day-detail h4{font-family:var(--font-heading); font-size:14px; text-transform:capitalize; margin:0 0 10px; color:var(--text-card);}

/* ---------- Cumplimiento (Mis tareas) ---------- */
.cumplimiento{ margin-top:6px; display:flex; align-items:center; gap:8px; }
.cumplimiento-bar{ flex:1; height:7px; background:var(--card-bg-hover); border-radius:6px; overflow:hidden; max-width:140px; }
.cumplimiento-bar-fill{ height:100%; background:var(--success); }
.cumplimiento-label{ font-size:11px; color:var(--text-muted); font-weight:700; white-space:nowrap; }

@media (max-width:600px){
  .task-card{flex-wrap:wrap;}
  .task-actions{width:100%; justify-content:flex-start; margin-top:6px;}
  .field-row{flex-direction:column;}
  .month-cell{min-height:44px; padding:4px 3px;}
}

/* ---------- MODAL genérico ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:200;
  display:flex; align-items:center; justify-content:center; padding:16px;
  opacity:0; pointer-events:none; transition:opacity .15s ease; overflow-y:auto;
}
.modal-backdrop.open{opacity:1; pointer-events:auto;}
.modal-card{
  background:var(--card-bg); color:var(--text-card); border-radius:22px;
  padding:24px; width:100%; max-width:480px; box-shadow:0 18px 48px rgba(0,0,0,.35);
  transform:translateY(10px); transition:transform .15s ease; margin:auto;
  max-height:92vh; overflow-y:auto;
}
.modal-backdrop.open .modal-card{transform:translateY(0);}
.modal-card h3{margin:0 0 4px; font-family:'Fredoka',sans-serif; font-size:1.2rem; text-transform:uppercase;}
.modal-card .modal-sub{margin:0 0 18px; font-size:0.85rem; color:var(--text-muted);}
.modal-card p.confirm-text{margin:0 0 22px; font-size:0.92rem; line-height:1.5; color:var(--text-muted);}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}
.field input[type=text], .field input[type=date], .field input[type=time], .field input[type=number],
.field select, .field textarea{
  width:100%; background:var(--input-bg); color:var(--text-card);
  border:2px solid var(--card-border); border-radius:12px;
  padding:10px 12px; font-family: var(--font-body); font-size:14px;
}
.field textarea{resize:vertical; min-height:60px;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--primary); outline-offset:1px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:6px; flex-wrap:wrap;}
.modal-actions button{
  font-family: var(--font-heading); cursor:pointer; border:none; border-radius:20px;
  font-weight:700; font-size:13px; padding:11px 20px; text-transform:uppercase; letter-spacing:.02em;
}
.modal-cancel{background:var(--card-bg-hover); color:var(--text-card); border:2px solid var(--card-border) !important;}
.modal-cancel:hover{background:var(--card-border);}
.modal-save{background:var(--primary); color:#fff;}
.modal-save:hover{filter:brightness(1.06);}
.modal-danger{background:var(--danger); color:#fff;}
.modal-danger:hover{filter:brightness(1.08);}
.modal-close-x{
  position:absolute; top:16px; right:16px; background:none; border:none; font-size:18px;
  color:var(--text-muted); cursor:pointer; width:30px; height:30px;
}

.history-list{display:flex; flex-direction:column; gap:10px; max-height:50vh; overflow-y:auto;}
.history-item{border:2px solid var(--card-border); border-radius:14px; padding:10px 12px; font-size:12.5px;}
.history-item .h-fecha{font-weight:800; font-family:var(--font-heading); color:var(--text-card); font-size:13px;}
.history-item .h-obs{color:var(--text-muted); margin-top:4px;}
.history-empty{color:var(--text-muted); font-size:13px; text-align:center; padding:20px;}

#toast-container{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:300; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{background:var(--af-coffee); color:var(--af-cream); padding:10px 18px; border-radius:20px; font-size:13px; font-weight:700; box-shadow:0 6px 18px rgba(0,0,0,.3); animation:toast-in .2s ease;}
@keyframes toast-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

</style>

<style>
  @media (max-width: 768px) {
    input, select, textarea { font-size: 16px !important; }
  }
  * { touch-action: manipulation !important; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <img src="../../assets/icons/icon.svg" alt="Africa">
    <div class="brand-text">
      <h1>Día a Día</h1>
      <span>Tus tareas periódicas</span>
    </div>
  </div>
  <button class="btn-new-task" id="btnNewTask">➕ Nueva tarea</button>
  <button class="theme-toggle" id="themeToggle" type="button" title="Cambiar tema" aria-label="Cambiar tema claro/oscuro">🌙</button>
</div>

<div class="main-wrap">

  <div class="summary-strip">
    <div class="summary-pill"><b id="sumPendientes">0</b><span>Pendientes hoy</span></div>
    <div class="summary-pill vencidas"><b id="sumVencidas">0</b><span>Vencidas</span></div>
    <div class="summary-pill completadas"><b id="sumCompletadas">0</b><span>Completadas hoy</span></div>
    <div class="summary-pill"><b id="sumTotal">0</b><span>Tareas activas</span></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="pendientes">Pendientes <span class="count" id="tabCountPendientes">0</span></button>
    <button class="tab-btn" data-tab="completadas">Completadas hoy <span class="count" id="tabCountCompletadas">0</span></button>
    <button class="tab-btn" data-tab="semana">Semana</button>
    <button class="tab-btn" data-tab="mes">Mes</button>
    <button class="tab-btn" data-tab="todas">Mis tareas <span class="count" id="tabCountTodas">0</span></button>
  </div>

  <div class="period-nav hidden" id="periodNav">
    <button type="button" class="icon-btn" id="periodPrev" title="Anterior">◀</button>
    <span id="periodLabel"></span>
    <button type="button" class="icon-btn" id="periodNext" title="Siguiente">▶</button>
    <button type="button" class="btn-period-today" id="periodToday">Hoy</button>
  </div>

  <div class="task-list" id="taskList"></div>
  <div id="calendarView"></div>
  <div class="empty-msg hidden" id="emptyMsg">
    <span class="emoji">🌴</span>
    <h3>Nada por aquí</h3>
    <p id="emptyMsgText">No tienes tareas pendientes en esta vista.</p>
  </div>

</div>

<!-- ============ MODAL: Nueva/Editar tarea ============ -->
<div id="modal-task" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
  <div class="modal-card" style="max-width:560px; position:relative;">
    <button type="button" class="modal-close-x" data-close-modal="modal-task">✕</button>
    <h3 id="taskModalTitle">Nueva tarea</h3>
    <p class="modal-sub">Define qué debe hacerse y con qué frecuencia.</p>

    <div class="field">
      <label for="tf-nombre">Nombre *</label>
      <input type="text" id="tf-nombre" placeholder="Ej: Revisar extintores">
    </div>
    <div class="field">
      <label for="tf-descripcion">Descripción</label>
      <textarea id="tf-descripcion" placeholder="Detalle de qué implica la tarea"></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="tf-fecha-inicio">Fecha de inicio *</label>
        <input type="date" id="tf-fecha-inicio">
      </div>
      <div class="field">
        <label for="tf-hora">Hora (opcional)</label>
        <input type="time" id="tf-hora">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="tf-periodicidad">Periodicidad *</label>
        <select id="tf-periodicidad">
          <option value="diaria">Diaria</option>
          <option value="semanal">Semanal</option>
          <option value="mensual">Mensual</option>
          <option value="trimestral">Trimestral</option>
          <option value="semestral">Semestral</option>
          <option value="anual">Anual</option>
          <option value="personalizada">Personalizada (cada N días)</option>
        </select>
      </div>
      <div class="field" id="tf-personalizada-wrap" style="display:none;">
        <label for="tf-personalizada-dias">Cada cuántos días</label>
        <input type="number" id="tf-personalizada-dias" min="1" step="1" placeholder="Ej: 10">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="tf-prioridad">Prioridad *</label>
        <select id="tf-prioridad">
          <option value="alta">Alta</option>
          <option value="media" selected>Media</option>
          <option value="baja">Baja</option>
        </select>
      </div>
      <div class="field">
        <label for="tf-categoria">Categoría (opcional)</label>
        <input type="text" id="tf-categoria" placeholder="Ej: Mantenimiento">
      </div>
    </div>
    <div class="field">
      <label for="tf-responsable">Responsable</label>
      <input type="text" id="tf-responsable" placeholder="Nombre del responsable">
    </div>
    <div class="field">
      <label for="tf-observaciones">Observaciones</label>
      <textarea id="tf-observaciones" placeholder="Notas generales sobre la tarea"></textarea>
    </div>

    <div class="modal-actions">
      <button type="button" class="modal-cancel" data-close-modal="modal-task">Cancelar</button>
      <button type="button" class="modal-save" id="tf-save-btn">Guardar tarea</button>
    </div>
  </div>
</div>

<!-- ============ MODAL: Reprogramar ============ -->
<div id="modal-reprogramar" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="reprogramarTitle">
  <div class="modal-card" style="position:relative;">
    <button type="button" class="modal-close-x" data-close-modal="modal-reprogramar">✕</button>
    <h3 id="reprogramarTitle">Reprogramar tarea</h3>
    <p class="modal-sub" id="reprogramarSub"></p>
    <div class="field">
      <label for="rp-fecha">Nueva fecha *</label>
      <input type="date" id="rp-fecha">
    </div>
    <div class="field">
      <label for="rp-motivo">Motivo (opcional)</label>
      <textarea id="rp-motivo" placeholder="¿Por qué se reprograma?"></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" class="modal-cancel" data-close-modal="modal-reprogramar">Cancelar</button>
      <button type="button" class="modal-save" id="rp-save-btn">Reprogramar</button>
    </div>
  </div>
</div>

<!-- ============ MODAL: Completar (con observación opcional) ============ -->
<div id="modal-completar" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="completarTitle">
  <div class="modal-card" style="position:relative;">
    <button type="button" class="modal-close-x" data-close-modal="modal-completar">✕</button>
    <h3 id="completarTitle">Marcar como completada</h3>
    <div class="field">

<script>
const MODULE_KEY = 'diaadia';
let tasks = [];
let currentTab = 'pendientes';
let editingTaskId = null;       // tarea que se está editando en el modal de tarea (null = nueva)
let pendingCompleteCtx = null;  // {taskId, fecha} para el modal de completar
let pendingReprogramCtx = null; // {taskId, fecha} para el modal de reprogramar
let pendingHistoryTaskId = null;
let pendingDeleteTaskId = null;
let currentUserNombre = '';
let weekOffset = 0;   // 0 = semana actual, -1 = anterior, +1 = siguiente
let monthOffset = 0;  // 0 = mes actual
let selectedMonthDay = null; // fecha 'YYYY-MM-DD' seleccionada en la vista mensual

/* ---------- Fechas: todo en horario local, formato YYYY-MM-DD ---------- */
function todayStr(){ return dateToStr(new Date()); }
function dateToStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function strToDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(dateStr, n){ const d=strToDate(dateStr); d.setDate(d.getDate()+n); return dateToStr(d); }
function fmtFechaCorta(dateStr){
  const d = strToDate(dateStr);
  return d.toLocaleDateString('es-CO', { day:'2-digit', month:'short' });
}
function fmtFechaLarga(dateStr){
  const d = strToDate(dateStr);
  return d.toLocaleDateString('es-CO', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

/* ---------- Motor de periodicidad ---------- */
function ocurreEnFecha(task, dateStr){
  if (dateStr < task.fechaInicio) return false;
  const start = strToDate(task.fechaInicio);
  const d = strToDate(dateStr);
  const diffDays = Math.round((d - start) / 86400000);
  switch(task.periodicidad){
    case 'diaria': return true;
    case 'semanal': return diffDays % 7 === 0;
    case 'personalizada': return task.personalizadaDias > 0 && diffDays % task.personalizadaDias === 0;
    case 'mensual': return sameMonthDayEvery(start, d, 1);
    case 'trimestral': return sameMonthDayEvery(start, d, 3);
    case 'semestral': return sameMonthDayEvery(start, d, 6);
    case 'anual': return sameMonthDayEvery(start, d, 12);
    default: return false;
  }
}
function sameMonthDayEvery(start, d, everyMonths){
  if (d.getDate() !== start.getDate()) {
    // Si el día de inicio no existe en el mes de "d" (ej. 31 en febrero), se toma el último día del mes como equivalente.
    const lastDayOfDMonth = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    if (!(start.getDate() > lastDayOfDMonth && d.getDate() === lastDayOfDMonth)) return false;
  }
  const monthsDiff = (d.getFullYear()-start.getFullYear())*12 + (d.getMonth()-start.getMonth());
  return monthsDiff >= 0 && monthsDiff % everyMonths === 0;
}

// Resuelve el estado de una fecha puntual para una tarea: prioriza el
// registro guardado (si existe); si no hay registro, cae al cálculo de
// periodicidad (ocurrencia "implícita", nunca tocada por el usuario).
function getOcurrencia(task, dateStr, hoy){
  const registro = task.registros && task.registros[dateStr];
  if (registro) {
    let estado = registro.estado;
    if (estado === 'pendiente' && dateStr < hoy) estado = 'vencida';
    return { fecha: dateStr, estado, registro };
  }
  if (ocurreEnFecha(task, dateStr)) {
    const estado = dateStr < hoy ? 'vencida' : 'pendiente';
    return { fecha: dateStr, estado, registro: null };
  }
  return null;
}

// Para la vista "Pendientes": la ocurrencia relevante de una tarea activa
// es la más antigua sin resolver (sin registro, o con estado pendiente)
// dentro de una ventana razonable hacia atrás (14 días) — evita que una
// tarea diaria vieja sin tocar inunde la lista con decenas de filas.
const VENTANA_BUSQUEDA_ATRAS = 14;
function ocurrenciaRelevante(task, hoy){
  for (let i = VENTANA_BUSQUEDA_ATRAS; i >= 0; i--) {
    const fecha = addDays(hoy, -i);
    if (fecha < task.fechaInicio) continue;
    const oc = getOcurrencia(task, fecha, hoy);
    if (oc && (oc.estado === 'pendiente' || oc.estado === 'vencida')) return oc;
  }
  return null;
}

// Todas las ocurrencias de una tarea dentro de un rango de fechas cerrado
// [fromStr, toStr] (máx. 370 días, para vistas de semana/mes y cumplimiento).
function ocurrenciasEnRango(task, fromStr, toStr){
  const out = [];
  let cursor = fromStr < task.fechaInicio ? task.fechaInicio : fromStr;
  let guard = 0;
  while (cursor <= toStr && guard < 370) {
    const oc = getOcurrencia(task, cursor, todayStr());
    if (oc) out.push(oc);
    cursor = addDays(cursor, 1);
    guard++;
  }
  return out;
}

// % de cumplimiento de una tarea en los últimos N días: completadas / (completadas + vencidas + reprogramadas + pendientes-pasadas).
// Las ocurrencias de hoy/futuras no cuentan todavía (no ha pasado su plazo).
function cumplimientoTarea(task, dias){
  const hoy = todayStr();
  const desde = addDays(hoy, -dias);
  const ocs = ocurrenciasEnRango(task, desde, addDays(hoy, -1)); // hasta ayer
  if (ocs.length === 0) return null;
  const completadas = ocs.filter(o => o.estado === 'completada').length;
  return { pct: Math.round((completadas / ocs.length) * 100), completadas, total: ocs.length };
}

/* ---------- Persistencia ---------- */
async function loadTasks(){
  tasks = await OfflineStorage.get(MODULE_KEY, 'tasks', []);
}
async function saveTasks(){
  await OfflineStorage.set(MODULE_KEY, 'tasks', tasks);
}
function uid(){ return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

async function loadCurrentUserNombre(){
  try{
    const { data } = await supabaseClient.auth.getSession();
    const authUid = data && data.session ? data.session.user.id : null;
    if (!authUid) return;
    const { data: profile } = await supabaseClient.from('profiles').select('nombre, usuario').eq('id', authUid).maybeSingle();
    if (profile) currentUserNombre = profile.nombre || profile.usuario || '';
  }catch(e){ /* offline: se deja vacío, el campo Responsable queda editable a mano */ }
}

/* ---------- Render ---------- */
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function prioridadLabel(p){ return { alta:'Alta', media:'Media', baja:'Baja' }[p] || p; }
function periodicidadLabel(task){
  const map = { diaria:'Diaria', semanal:'Semanal', mensual:'Mensual', trimestral:'Trimestral', semestral:'Semestral', anual:'Anual' };
  if (task.periodicidad === 'personalizada') return `Cada ${task.personalizadaDias} día(s)`;
  return map[task.periodicidad] || task.periodicidad;
}

// "Completadas hoy" = completadas en el momento (fechaRealizacion es de
// hoy), sin importar para qué fecha estaba programada la ocurrencia
// originalmente — una tarea atrasada que se pone al día hoy sí cuenta.
function completadaHoyEntry(task, hoy){
  if (!task.registros) return null;
  for (const fecha of Object.keys(task.registros)) {
    const r = task.registros[fecha];
    if (r.estado === 'completada' && r.fechaRealizacion && r.fechaRealizacion.slice(0,10) === hoy) {
      return { fecha, registro: r };
    }
  }
  return null;
}

function computeSummary(){
  const hoy = todayStr();
  let pendientes = 0, vencidas = 0, completadas = 0, total = 0;
  tasks.forEach(task => {
    if (!task.activa) return;
    total++;
    const oc = ocurrenciaRelevante(task, hoy);
    if (oc) {
      if (oc.estado === 'vencida') vencidas++;
      else if (oc.estado === 'pendiente') pendientes++;
    }
    if (completadaHoyEntry(task, hoy)) completadas++;
  });
  return { pendientes, vencidas, completadas, total };
}

function renderSummary(){
  const s = computeSummary();
  document.getElementById('sumPendientes').textContent = s.pendientes;
  document.getElementById('sumVencidas').textContent = s.vencidas;
  document.getElementById('sumCompletadas').textContent = s.completadas;
  document.getElementById('sumTotal').textContent = s.total;
  document.getElementById('tabCountPendientes').textContent = s.pendientes + s.vencidas;
  document.getElementById('tabCountCompletadas').textContent = s.completadas;
  document.getElementById('tabCountTodas').textContent = s.total;
}

function renderTaskList(){
  const hoy = todayStr();
  const listEl = document.getElementById('taskList');
  const emptyEl = document.getElementById('emptyMsg');
  const emptyText = document.getElementById('emptyMsgText');
  const calEl = document.getElementById('calendarView');
  const periodNav = document.getElementById('periodNav');
  listEl.innerHTML = '';
  calEl.innerHTML = '';

  if (currentTab === 'semana' || currentTab === 'mes') {
    listEl.classList.add('hidden');
    emptyEl.classList.add('hidden');
    periodNav.classList.remove('hidden');
    if (currentTab === 'semana') renderSemanaView(calEl); else renderMesView(calEl);
    renderSummary();
    return;
  }
  listEl.classList.remove('hidden');
  periodNav.classList.add('hidden');

  if (currentTab === 'todas') {
    renderTodasTab(listEl, emptyEl, emptyText);
    renderSummary();
    return;
  }

  // pendientes / completadas: se arma una lista de "ocurrencias" (tarea + fecha relevante)
  const items = [];
  tasks.forEach(task => {
    if (!task.activa) return;
    if (currentTab === 'pendientes') {
      const oc = ocurrenciaRelevante(task, hoy);
      if (oc) items.push({ task, oc });
    } else if (currentTab === 'completadas') {
      const entry = completadaHoyEntry(task, hoy);
      if (entry) items.push({ task, oc: { fecha: entry.fecha, estado: 'completada', registro: entry.registro } });
    }
  });

  items.sort((a,b) => {
    if (a.oc.fecha !== b.oc.fecha) return a.oc.fecha < b.oc.fecha ? -1 : 1;
    return (a.task.hora||'99:99').localeCompare(b.task.hora||'99:99');
  });

  if (items.length === 0) {
    emptyText.textContent = currentTab === 'pendientes'
      ? 'No tienes tareas pendientes ni vencidas. ¡Al día!'
      : 'Todavía no has completado tareas hoy.';
    emptyEl.classList.remove('hidden');
  } else {
    emptyEl.classList.add('hidden');
    items.forEach(({task, oc}) => listEl.appendChild(buildOcurrenciaCard(task, oc, hoy)));
  }
  renderSummary();
}

function renderTodasTab(listEl, emptyEl, emptyText){
  const activas = tasks.filter(t => t.activa);
  if (activas.length === 0) {
    emptyText.textContent = 'Todavía no has creado tareas periódicas.';
    emptyEl.classList.remove('hidden');
    return;
  }
  emptyEl.classList.add('hidden');
  activas.sort((a,b) => a.nombre.localeCompare(b.nombre));
  activas.forEach(task => listEl.appendChild(buildTaskDefCard(task)));
}

/* ---------- Vista semanal ---------- */
function getMondayOfWeek(dateStr){
  const d = strToDate(dateStr);
  const dow = d.getDay(); // 0=domingo..6=sábado
  const diffToMonday = dow === 0 ? -6 : 1 - dow;
  d.setDate(d.getDate() + diffToMonday);
  return dateToStr(d);
}
function renderSemanaView(container){
  const hoy = todayStr();
  const monday = addDays(getMondayOfWeek(hoy), weekOffset * 7);
  const sunday = addDays(monday, 6);
  document.getElementById('periodLabel').textContent = `${fmtFechaCorta(monday)} – ${fmtFechaCorta(sunday)}`;

  const dias = [];
  for (let i = 0; i < 7; i++) dias.push(addDays(monday, i));
  const nombresDia = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

  const activas = tasks.filter(t => t.activa);
  let huboAlgo = false;

  dias.forEach((fecha, idx) => {
    const ocsDelDia = [];
    activas.forEach(task => {
      const oc = getOcurrencia(task, fecha, hoy);
      if (oc) ocsDelDia.push({ task, oc });
    });
    ocsDelDia.sort((a,b) => (a.task.hora||'99:99').localeCompare(b.task.hora||'99:99'));

    const dayWrap = document.createElement('div');
    dayWrap.className = 'week-day';
    const head = document.createElement('div');
    head.className = 'week-day-head' + (fecha === hoy ? ' is-today' : '');
    head.innerHTML = `<b>${nombresDia[idx]}</b><span>${fmtFechaCorta(fecha)}${fecha===hoy?' · hoy':''}</span>`;
    dayWrap.appendChild(head);

    const chipList = document.createElement('div');
    chipList.className = 'week-chip-list';
    if (ocsDelDia.length === 0) {
      const emptyLine = document.createElement('div');
      emptyLine.className = 'week-day-empty';
      emptyLine.textContent = 'Sin tareas';
      chipList.appendChild(emptyLine);
    } else {
      huboAlgo = true;
      ocsDelDia.forEach(({task, oc}) => {
        const chip = document.createElement('div');
        chip.className = 'week-chip' + (oc.estado === 'completada' ? ' completada' : '') + (oc.estado === 'vencida' ? ' vencida' : '');
        const estadoTxt = { completada:'✅', reprogramada:'📅', vencida:'⚠️', pendiente:'⏳' }[oc.estado] || '';
        chip.innerHTML = `<span class="wc-name">${task.hora ? `🕐 ${escapeHtml(task.hora)} · ` : ''}${escapeHtml(task.nombre)}</span><span>${estadoTxt}</span>`;
        chip.addEventListener('click', () => openHistorialModal(task.id));
        chipList.appendChild(chip);
      });
    }
    dayWrap.appendChild(chipList);
    container.appendChild(dayWrap);
  });

  if (!huboAlgo) {
    const msg = document.createElement('div');
    msg.className = 'empty-msg';
    msg.innerHTML = '<span class="emoji">🗓️</span><h3>Semana libre</h3><p>No hay tareas programadas en estos 7 días.</p>';
    container.appendChild(msg);
  }
}

/* ---------- Vista mensual ---------- */
function renderMesView(container){
  const hoy = todayStr();
  const base = strToDate(hoy);
  const year = base.getFullYear();
  const month = base.getMonth() + monthOffset;
  const firstOfMonth = new Date(year, month, 1);
  const lastOfMonth = new Date(year, month + 1, 0);
  const monthLabel = firstOfMonth.toLocaleDateString('es-CO', { month:'long', year:'numeric' });
  document.getElementById('periodLabel').textContent = monthLabel;

  const firstOfMonthStr = dateToStr(firstOfMonth);
  const lastOfMonthStr = dateToStr(lastOfMonth);
  const gridStart = getMondayOfWeek(firstOfMonthStr);
  const dowLastCell = new Date(lastOfMonth); // domingo que cierra la última semana visible
  const gridEndDow = dowLastCell.getDay();
  const gridEnd = addDays(lastOfMonthStr, gridEndDow === 0 ? 0 : 7 - gridEndDow);

  const activas = tasks.filter(t => t.activa);
  const conteoPorDia = {}; // fecha -> {pendiente,vencida,completada}
  let cursor = gridStart;
  while (cursor <= gridEnd) {
    conteoPorDia[cursor] = { pendiente:0, vencida:0, completada:0 };
    cursor = addDays(cursor, 1);
  }
  activas.forEach(task => {
    ocurrenciasEnRango(task, gridStart, gridEnd).forEach(oc => {
      if (conteoPorDia[oc.fecha] && conteoPorDia[oc.fecha][oc.estado] !== undefined) conteoPorDia[oc.fecha][oc.estado]++;
    });
  });

  const grid = document.createElement('div');
  grid.className = 'month-grid';
  ['L','M','X','J','V','S','D'].forEach(d => {
    const dow = document.createElement('div'); dow.className = 'month-dow'; dow.textContent = d;
    grid.appendChild(dow);
  });

  cursor = gridStart;
  while (cursor <= gridEnd) {
    const cell = document.createElement('div');
    const inMonth = cursor >= firstOfMonthStr && cursor <= lastOfMonthStr;
    cell.className = 'month-cell' + (inMonth ? '' : ' other-month') + (cursor === hoy ? ' is-today' : '') + (cursor === selectedMonthDay ? ' selected' : '');
    const counts = conteoPorDia[cursor];
    const dots = ['pendiente','vencida','completada'].filter(k => counts[k] > 0)
      .map(k => `<span class="mc-dot ${k}"></span>`).join('');
    cell.innerHTML = `<span class="mc-num">${strToDate(cursor).getDate()}</span><span class="mc-dots">${dots}</span>`;
    cell.addEventListener('click', () => { selectedMonthDay = cursor; renderMesView(container); renderMonthDayDetail(cursor); });
    grid.appendChild(cell);
    cursor = addDays(cursor, 1);
  }
  container.innerHTML = '';
  container.appendChild(grid);

  const detailWrap = document.createElement('div');
  detailWrap.id = 'monthDayDetail';
  detailWrap.className = 'month-day-detail';
  container.appendChild(detailWrap);
  renderMonthDayDetail(selectedMonthDay || hoy);
}
function renderMonthDayDetail(fecha){
  selectedMonthDay = fecha;
  const wrap = document.getElementById('monthDayDetail');
  if (!wrap) return;
  const hoy = todayStr();
  const activas = tasks.filter(t => t.activa);
  const ocsDelDia = [];
  activas.forEach(task => {
    const oc = getOcurrencia(task, fecha, hoy);
    if (oc) ocsDelDia.push({ task, oc });
  });
  ocsDelDia.sort((a,b) => (a.task.hora||'99:99').localeCompare(b.task.hora||'99:99'));

  let html = `<h4>${fmtFechaLarga(fecha)}</h4>`;
  if (ocsDelDia.length === 0) {
    html += `<div class="week-day-empty">Sin tareas programadas este día.</div>`;
  } else {
    html += `<div class="week-chip-list">` + ocsDelDia.map(({task, oc}) => {
      const estadoTxt = { completada:'✅', reprogramada:'📅', vencida:'⚠️', pendiente:'⏳' }[oc.estado] || '';
      return `<div class="week-chip${oc.estado==='completada'?' completada':''}${oc.estado==='vencida'?' vencida':''}"><span class="wc-name">${task.hora ? `🕐 ${escapeHtml(task.hora)} · ` : ''}${escapeHtml(task.nombre)}</span><span>${estadoTxt}</span></div>`;
    }).join('') + `</div>`;
  }
  wrap.innerHTML = html;
}

document.getElementById('periodPrev').addEventListener('click', () => {
  if (currentTab === 'semana') weekOffset--; else monthOffset--;
  renderTaskList();
});
document.getElementById('periodNext').addEventListener('click', () => {
  if (currentTab === 'semana') weekOffset++; else monthOffset++;
  renderTaskList();
});
document.getElementById('periodToday').addEventListener('click', () => {
  weekOffset = 0; monthOffset = 0; selectedMonthDay = null;
  renderTaskList();
});

function buildOcurrenciaCard(task, oc, hoy){
  const card = document.createElement('div');
  const completada = oc.estado === 'completada';
  card.className = 'task-card' + (oc.estado === 'vencida' ? ' vencida' : '') + (completada ? ' completada' : '');

  const check = document.createElement('button');
  check.className = 'task-check';
  check.type = 'button';
  check.setAttribute('aria-label', completada ? 'Marcada como completada' : 'Marcar como completada');
  check.innerHTML = completada ? '✓' : '';
  if (!completada) check.addEventListener('click', () => openCompletarModal(task.id, oc.fecha));

  const body = document.createElement('div');
  body.className = 'task-body';
  const estadoBadgeClass = completada ? '' : (oc.estado === 'vencida' ? 'estado-vencida' : 'estado-pendiente');
  const estadoLabel = completada ? '' : (oc.estado === 'vencida' ? `Vencida desde ${fmtFechaCorta(oc.fecha)}` : 'Hoy');
  body.innerHTML = `
    <div class="task-top-row">
      <span class="task-name">${escapeHtml(task.nombre)}</span>
      <span class="badge prioridad-${task.prioridad}">${prioridadLabel(task.prioridad)}</span>
      ${estadoLabel ? `<span class="badge ${estadoBadgeClass}">${estadoLabel}</span>` : ''}
      ${task.categoria ? `<span class="badge categoria">${escapeHtml(task.categoria)}</span>` : ''}
    </div>
    <div class="task-meta">
      ${task.hora ? `🕐 <b>${escapeHtml(task.hora)}</b> · ` : ''}${periodicidadLabel(task)}${task.responsable ? ` · Responsable: <b>${escapeHtml(task.responsable)}</b>` : ''}
    </div>
    ${task.descripcion ? `<div class="task-desc">${escapeHtml(task.descripcion)}</div>` : ''}
  `;

  const actions = document.createElement('div');
  actions.className = 'task-actions';
  if (!completada) {
    const btnRepro = document.createElement('button');
    btnRepro.className = 'icon-btn'; btnRepro.type = 'button'; btnRepro.title = 'Reprogramar';
    btnRepro.textContent = '📅';
    btnRepro.addEventListener('click', () => openReprogramarModal(task.id, oc.fecha));
    actions.appendChild(btnRepro);
  }
  const btnHist = document.createElement('button');
  btnHist.className = 'icon-btn'; btnHist.type = 'button'; btnHist.title = 'Historial';
  btnHist.textContent = '🕓';
  btnHist.addEventListener('click', () => openHistorialModal(task.id));
  actions.appendChild(btnHist);

  const btnEdit = document.createElement('button');
  btnEdit.className = 'icon-btn'; btnEdit.type = 'button'; btnEdit.title = 'Editar tarea';
  btnEdit.textContent = '✏️';
  btnEdit.addEventListener('click', () => openTaskModal(task.id));
  actions.appendChild(btnEdit);

  card.appendChild(check);
  card.appendChild(body);
  card.appendChild(actions);
  return card;
}

function buildTaskDefCard(task){
  const card = document.createElement('div');
  card.className = 'task-card';
  const body = document.createElement('div');
  body.className = 'task-body';
  const cump = cumplimientoTarea(task, 30);
  body.innerHTML = `
    <div class="task-top-row">
      <span class="task-name">${escapeHtml(task.nombre)}</span>
      <span class="badge prioridad-${task.prioridad}">${prioridadLabel(task.prioridad)}</span>
      ${task.categoria ? `<span class="badge categoria">${escapeHtml(task.categoria)}</span>` : ''}
    </div>
    <div class="task-meta">
      ${periodicidadLabel(task)} · desde ${fmtFechaCorta(task.fechaInicio)}${task.hora ? ` · 🕐 ${escapeHtml(task.hora)}` : ''}${task.responsable ? ` · Responsable: <b>${escapeHtml(task.responsable)}</b>` : ''}
    </div>
    ${task.descripcion ? `<div class="task-desc">${escapeHtml(task.descripcion)}</div>` : ''}
    ${cump ? `<div class="cumplimiento"><div class="cumplimiento-bar"><div class="cumplimiento-bar-fill" style="width:${cump.pct}%; background:${cump.pct>=80?'var(--success)':cump.pct>=50?'var(--af-amber)':'var(--danger)'}"></div></div><span class="cumplimiento-label">${cump.pct}% cumplimiento (${cump.completadas}/${cump.total}, últimos 30 días)</span></div>` : ''}
  `;
  const actions = document.createElement('div');
  actions.className = 'task-actions';

  const btnHist = document.createElement('button');
  btnHist.className = 'icon-btn'; btnHist.type = 'button'; btnHist.title = 'Historial';
  btnHist.textContent = '🕓';
  btnHist.addEventListener('click', () => openHistorialModal(task.id));
  actions.appendChild(btnHist);

  const btnEdit = document.createElement('button');
  btnEdit.className = 'icon-btn'; btnEdit.type = 'button'; btnEdit.title = 'Editar';
  btnEdit.textContent = '✏️';
  btnEdit.addEventListener('click', () => openTaskModal(task.id));
  actions.appendChild(btnEdit);

  const btnDel = document.createElement('button');
  btnDel.className = 'icon-btn danger'; btnDel.type = 'button'; btnDel.title = 'Eliminar';
  btnDel.textContent = '🗑️';
  btnDel.addEventListener('click', () => openConfirmDelete(task.id));
  actions.appendChild(btnDel);

  card.appendChild(body);
  card.appendChild(actions);
  return card;
}

/* ---------- Modal genérico: abrir/cerrar ---------- */
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('[data-close-modal]').forEach(btn => {
  btn.addEventListener('click', () => closeModal(btn.getAttribute('data-close-modal')));
});
document.querySelectorAll('.modal-backdrop').forEach(bd => {
  bd.addEventListener('click', (e) => { if (e.target === bd) bd.classList.remove('open'); });
});

/* ---------- Toast ---------- */
function toast(msg){
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

/* ---------- Modal: Nueva/Editar tarea ---------- */
function openTaskModal(taskId){
  editingTaskId = taskId || null;
  const task = taskId ? tasks.find(t => t.id === taskId) : null;
  document.getElementById('taskModalTitle').textContent = task ? 'Editar tarea' : 'Nueva tarea';
  document.getElementById('tf-nombre').value = task ? task.nombre : '';
  document.getElementById('tf-descripcion').value = task ? (task.descripcion||'') : '';
  document.getElementById('tf-fecha-inicio').value = task ? task.fechaInicio : todayStr();
  document.getElementById('tf-hora').value = task ? (task.hora||'') : '';
  document.getElementById('tf-periodicidad').value = task ? task.periodicidad : 'diaria';
  document.getElementById('tf-personalizada-dias').value = task && task.personalizadaDias ? task.personalizadaDias : '';
  document.getElementById('tf-prioridad').value = task ? task.prioridad : 'media';
  document.getElementById('tf-categoria').value = task ? (task.categoria||'') : '';
  document.getElementById('tf-responsable').value = task ? (task.responsable||'') : (currentUserNombre||'');
  document.getElementById('tf-observaciones').value = task ? (task.observaciones||'') : '';
  togglepersonalizadaField();
  openModal('modal-task');
}
function togglepersonalizadaField(){
  const per = document.getElementById('tf-periodicidad').value;
  document.getElementById('tf-personalizada-wrap').style.display = per === 'personalizada' ? '' : 'none';
}
document.getElementById('tf-periodicidad').addEventListener('change', togglepersonalizadaField);
document.getElementById('btnNewTask').addEventListener('click', () => openTaskModal(null));

document.getElementById('tf-save-btn').addEventListener('click', async () => {
  const nombre = document.getElementById('tf-nombre').value.trim();
  const fechaInicio = document.getElementById('tf-fecha-inicio').value;
  const periodicidad = document.getElementById('tf-periodicidad').value;
  const personalizadaDias = parseInt(document.getElementById('tf-personalizada-dias').value, 10) || 0;

  if (!nombre) { toast('El nombre es obligatorio'); return; }
  if (!fechaInicio) { toast('La fecha de inicio es obligatoria'); return; }
  if (periodicidad === 'personalizada' && personalizadaDias <= 0) { toast('Indica cada cuántos días se repite'); return; }

  const datos = {
    nombre,
    descripcion: document.getElementById('tf-descripcion').value.trim(),
    fechaInicio,
    hora: document.getElementById('tf-hora').value || '',
    periodicidad,
    personalizadaDias: periodicidad === 'personalizada' ? personalizadaDias : null,
    prioridad: document.getElementById('tf-prioridad').value,
    categoria: document.getElementById('tf-categoria').value.trim(),
    responsable: document.getElementById('tf-responsable').value.trim(),
    observaciones: document.getElementById('tf-observaciones').value.trim(),
  };

  if (editingTaskId) {
    const task = tasks.find(t => t.id === editingTaskId);
    Object.assign(task, datos);
    task.historialCambios = task.historialCambios || [];
    task.historialCambios.push({ cuando: new Date().toISOString(), accion: 'editada', detalle: `Editada por ${currentUserNombre||'usuario'}` });
    toast('Tarea actualizada');
  } else {
    tasks.push({
      id: uid(), ...datos, activa: true, registros: {},
      historialCambios: [{ cuando: new Date().toISOString(), accion: 'creada', detalle: `Creada por ${currentUserNombre||'usuario'}` }],
    });
    toast('Tarea creada');
  }
  await saveTasks();
  closeModal('modal-task');
  renderTaskList();
});

/* ---------- Modal: Completar ---------- */
function openCompletarModal(taskId, fecha){
  pendingCompleteCtx = { taskId, fecha };
  document.getElementById('cm-observaciones').value = '';
  openModal('modal-completar');
}
document.getElementById('cm-save-btn').addEventListener('click', async () => {
  if (!pendingCompleteCtx) return;
  const { taskId, fecha } = pendingCompleteCtx;
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;
  task.registros = task.registros || {};
  task.registros[fecha] = {
    ...(task.registros[fecha] || {}),
    estado: 'completada',
    fechaRealizacion: new Date().toISOString(),
    observaciones: document.getElementById('cm-observaciones').value.trim(),
    usuarioResponsable: currentUserNombre || task.responsable || '',
    reprogramadaA: null,
    historialReprogramaciones: (task.registros[fecha] && task.registros[fecha].historialReprogramaciones) || [],
  };
  await saveTasks();
  closeModal('modal-completar');
  pendingCompleteCtx = null;
  toast('Tarea marcada como completada');
  renderTaskList();
});

/* ---------- Modal: Reprogramar ---------- */
function openReprogramarModal(taskId, fecha){
  pendingReprogramCtx = { taskId, fecha };
  const task = tasks.find(t => t.id === taskId);
  document.getElementById('reprogramarSub').textContent = `"${task.nombre}" — originalmente programada para ${fmtFechaLarga(fecha)}.`;
  document.getElementById('rp-fecha').value = addDays(fecha, 1);
  document.getElementById('rp-fecha').min = todayStr();
  document.getElementById('rp-motivo').value = '';
  openModal('modal-reprogramar');
}
document.getElementById('rp-save-btn').addEventListener('click', async () => {
  if (!pendingReprogramCtx) return;
  const { taskId, fecha } = pendingReprogramCtx;
  const nuevaFecha = document.getElementById('rp-fecha').value;
  if (!nuevaFecha) { toast('Elige la nueva fecha'); return; }
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;
  const motivo = document.getElementById('rp-motivo').value.trim();
  const cuando = new Date().toISOString();
  task.registros = task.registros || {};

  const historialPrevio = (task.registros[fecha] && task.registros[fecha].historialReprogramaciones) || [];
  task.registros[fecha] = {
    ...(task.registros[fecha] || {}),
    estado: 'reprogramada',
    reprogramadaA: nuevaFecha,
    observaciones: (task.registros[fecha] && task.registros[fecha].observaciones) || '',
    usuarioResponsable: currentUserNombre || task.responsable || '',
    historialReprogramaciones: [...historialPrevio, { fechaAnterior: fecha, fechaNueva: nuevaFecha, cuando, motivo }],
  };
  // La nueva fecha queda como una ocurrencia pendiente propia, para que
  // aparezca en "Pendientes" ese día aunque la periodicidad no la genere.
  task.registros[nuevaFecha] = {
    ...(task.registros[nuevaFecha] || {}),
    estado: 'pendiente',
    fechaRealizacion: null,
    observaciones: task.registros[nuevaFecha]?.observaciones || '',
    reprogramadaA: null,
    usuarioResponsable: currentUserNombre || task.responsable || '',
    historialReprogramaciones: task.registros[nuevaFecha]?.historialReprogramaciones || [],
    reprogramadaDesde: fecha,
  };

  await saveTasks();
  closeModal('modal-reprogramar');
  pendingReprogramCtx = null;
  toast(`Reprogramada para ${fmtFechaCorta(nuevaFecha)}`);
  renderTaskList();
});

/* ---------- Modal: Historial ---------- */
function openHistorialModal(taskId){
  pendingHistoryTaskId = taskId;
  const task = tasks.find(t => t.id === taskId);
  document.getElementById('historialTitle').textContent = `Historial — ${task.nombre}`;
  const listEl = document.getElementById('historyList');
  listEl.innerHTML = '';

  const fechas = Object.keys(task.registros || {}).sort().reverse();
  if (fechas.length === 0) {
    listEl.innerHTML = '<div class="history-empty">Todavía no hay registros para esta tarea.</div>';
  } else {
    fechas.forEach(fecha => {
      const r = task.registros[fecha];
      const el = document.createElement('div');
      el.className = 'history-item';
      let estadoLabel;
      if (r.estado === 'completada') estadoLabel = '✅ Completada';
      else if (r.estado === 'reprogramada') estadoLabel = `📅 Reprogramada → ${fmtFechaCorta(r.reprogramadaA)}`;
      else if (r.estado === 'pendiente') estadoLabel = '⏳ Pendiente';
      else if (r.estado === 'vencida') estadoLabel = '⚠️ Vencida';
      else estadoLabel = r.estado;
      let extra = '';
      if (r.reprogramadaDesde) extra += `<div class="h-obs">Reprogramada desde ${fmtFechaCorta(r.reprogramadaDesde)}</div>`;
      if (r.historialReprogramaciones && r.historialReprogramaciones.length) {
        r.historialReprogramaciones.forEach(h => {
          extra += `<div class="h-obs">↪ Movida de ${fmtFechaCorta(h.fechaAnterior)} a ${fmtFechaCorta(h.fechaNueva)}${h.motivo ? ' — ' + escapeHtml(h.motivo) : ''}</div>`;
        });
      }
      if (r.observaciones) extra += `<div class="h-obs">${escapeHtml(r.observaciones)}</div>`;
      if (r.usuarioResponsable) extra += `<div class="h-obs">Responsable: ${escapeHtml(r.usuarioResponsable)}</div>`;
      el.innerHTML = `<div class="h-fecha">${fmtFechaCorta(fecha)} · ${estadoLabel}</div>${extra}`;
      listEl.appendChild(el);
    });
  }
  openModal('modal-historial');
}

/* ---------- Confirmación: eliminar tarea ---------- */
function openConfirmDelete(taskId){
  pendingDeleteTaskId = taskId;
  const task = tasks.find(t => t.id === taskId);
  document.getElementById('confirmTitle').textContent = '¿Eliminar tarea?';
  document.getElementById('confirmBody').textContent = `Se eliminará "${task.nombre}" y todo su historial de forma permanente. No se puede deshacer.`;
  openModal('modal-confirm');
}
document.getElementById('confirmCancelBtn').addEventListener('click', () => { closeModal('modal-confirm'); pendingDeleteTaskId = null; });
document.getElementById('confirmOkBtn').addEventListener('click', async () => {
  if (!pendingDeleteTaskId) return;
  tasks = tasks.filter(t => t.id !== pendingDeleteTaskId);
  await saveTasks();
  pendingDeleteTaskId = null;
  closeModal('modal-confirm');
  toast('Tarea eliminada');
  renderTaskList();
});

/* ---------- Tabs ---------- */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.getAttribute('data-tab');
    weekOffset = 0; monthOffset = 0; selectedMonthDay = null;
    renderTaskList();
  });
});

/* ---------- Tema ---------- */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('africa_tools_theme', next); } catch(e){}
});

/* ---------- Init ---------- */
(async function init(){
  applyTheme(document.documentElement.getAttribute('data-theme') || localStorage.getItem('africa_tools_theme') || 'light');
  await loadCurrentUserNombre();
  await loadTasks();
  renderTaskList();
})();
</script>

<script>
window.addEventListener('message', function(e){
  if(!e.data || e.data.type !== 'africa-tools-set-theme') return;
  var theme = e.data.theme === 'dark' ? 'dark' : 'light';
  if(typeof applyTheme === 'function') applyTheme(theme);
  try { localStorage.setItem('africa_tools_theme', theme); } catch(err){}
});
if (window.parent !== window) { var localToggle = document.getElementById('themeToggle'); if (localToggle) localToggle.style.display = 'none'; }
</script>
